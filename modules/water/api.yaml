openapi: 3.1.0
info:
  title: Neervalam
  version: 1.0.0
paths:
  /api/v1/water-bodies:
    get:
      tags:
      - Neervalam
      summary: Bodies
      operationId: bodies_api_v1_water_bodies_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
    post:
      tags:
      - Neervalam
      summary: Create Body
      operationId: create_body_api_v1_water_bodies_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BodyCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/water-bodies/{body_id}/observations:
    post:
      tags:
      - Neervalam
      summary: Observe
      operationId: observe_api_v1_water_bodies__body_id__observations_post
      security:
      - HTTPBearer: []
      parameters:
      - name: body_id
        in: path
        required: true
        schema:
          type: string
          title: Body Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObservationCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Neervalam
      summary: Observations
      operationId: observations_api_v1_water_bodies__body_id__observations_get
      security:
      - HTTPBearer: []
      parameters:
      - name: body_id
        in: path
        required: true
        schema:
          type: string
          title: Body Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ActivityCreate:
      properties:
        latitude:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Latitude
        longitude:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Longitude
        title:
          type: string
          maxLength: 180
          minLength: 5
          title: Title
        description:
          type: string
          maxLength: 2000
          minLength: 15
          title: Description
        category:
          type: string
          maxLength: 60
          minLength: 2
          title: Category
        locality:
          type: string
          maxLength: 160
          minLength: 2
          title: Locality
        starts_at:
          type: string
          format: date-time
          title: Starts At
        capacity:
          type: integer
          maximum: 10000.0
          minimum: 1.0
          title: Capacity
      additionalProperties: false
      type: object
      required:
      - latitude
      - longitude
      - title
      - description
      - category
      - locality
      - starts_at
      - capacity
      title: ActivityCreate
    Assign:
      properties:
        authority_id:
          type: string
          title: Authority Id
        calendar_id:
          type: string
          title: Calendar Id
        deadline_days:
          type: integer
          maximum: 90.0
          minimum: 1.0
          title: Deadline Days
          default: 3
        reason:
          type: string
          maxLength: 1000
          minLength: 5
          title: Reason
      additionalProperties: false
      type: object
      required:
      - authority_id
      - calendar_id
      - reason
      title: Assign
    AuthorityCreate:
      properties:
        name:
          type: string
          maxLength: 160
          minLength: 3
          title: Name
        department:
          type: string
          maxLength: 120
          minLength: 2
          title: Department
      additionalProperties: false
      type: object
      required:
      - name
      - department
      title: AuthorityCreate
    BodyCreate:
      properties:
        latitude:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Latitude
        longitude:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Longitude
        name:
          type: string
          maxLength: 160
          minLength: 3
          title: Name
        kind:
          type: string
          enum:
          - RIVER
          - LAKE
          - POND
          - CANAL
          - WELL
          - TANK
          - WETLAND
          title: Kind
        source:
          type: string
          maxLength: 300
          minLength: 5
          title: Source
      additionalProperties: false
      type: object
      required:
      - latitude
      - longitude
      - name
      - kind
      - source
      title: BodyCreate
    Body_upload_image_api_v1_uploads_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_upload_image_api_v1_uploads_post
    BoundaryCreate:
      properties:
        name:
          type: string
          maxLength: 160
          minLength: 3
          title: Name
        geojson:
          additionalProperties: true
          type: object
          title: Geojson
        source:
          type: string
          maxLength: 500
          minLength: 5
          title: Source
        verified:
          type: boolean
          title: Verified
          default: false
      additionalProperties: false
      type: object
      required:
      - name
      - geojson
      - source
      title: BoundaryCreate
    CalendarCreate:
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 2
          title: Name
        timezone:
          type: string
          title: Timezone
          default: Asia/Kolkata
        weekends:
          items:
            type: integer
          type: array
          maxItems: 6
          title: Weekends
          default:
          - 5
          - 6
        holidays:
          items:
            type: string
            format: date
          type: array
          maxItems: 366
          title: Holidays
          default: []
      additionalProperties: false
      type: object
      required:
      - name
      title: CalendarCreate
    Classification:
      properties:
        category:
          type: string
          title: Category
        severity:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
          title: Severity
        reason:
          type: string
          maxLength: 1000
          minLength: 5
          title: Reason
      additionalProperties: false
      type: object
      required:
      - category
      - severity
      - reason
      title: Classification
    ComplaintCreate:
      properties:
        latitude:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Latitude
        longitude:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Longitude
        title:
          type: string
          maxLength: 180
          minLength: 5
          title: Title
        description:
          type: string
          maxLength: 5000
          minLength: 15
          title: Description
        category:
          type: string
          title: Category
        image_id:
          type: string
          title: Image Id
        locality:
          type: string
          maxLength: 160
          title: Locality
          default: ''
      additionalProperties: false
      type: object
      required:
      - latitude
      - longitude
      - title
      - description
      - category
      - image_id
      title: ComplaintCreate
    DeleteAccount:
      properties:
        password:
          type: string
          maxLength: 128
          title: Password
      additionalProperties: false
      type: object
      required:
      - password
      title: DeleteAccount
    EscalationStep:
      properties:
        after_days:
          type: integer
          maximum: 90.0
          minimum: 1.0
          title: After Days
        authority_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Authority Id
      additionalProperties: false
      type: object
      required:
      - after_days
      title: EscalationStep
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Login:
      properties:
        identifier:
          type: string
          maxLength: 254
          minLength: 3
          title: Identifier
        password:
          type: string
          maxLength: 128
          minLength: 1
          title: Password
      additionalProperties: false
      type: object
      required:
      - identifier
      - password
      title: Login
    Merge:
      properties:
        target_id:
          type: string
          title: Target Id
        reason:
          type: string
          maxLength: 1000
          minLength: 5
          title: Reason
      additionalProperties: false
      type: object
      required:
      - target_id
      - reason
      title: Merge
    ModuleToggle:
      properties:
        id:
          type: string
          pattern: ^[a-z][a-z0-9_-]{1,59}$
          title: Id
        enabled:
          type: boolean
          title: Enabled
      additionalProperties: false
      type: object
      required:
      - id
      - enabled
      title: ModuleToggle
    ObservationCreate:
      properties:
        kind:
          type: string
          enum:
          - POLLUTION
          - GARBAGE
          - ENCROACHMENT
          - BLOCKAGE
          - LOW_LEVEL
          - DAMAGE
          - GENERAL
          title: Kind
        description:
          type: string
          maxLength: 2000
          minLength: 15
          title: Description
      additionalProperties: false
      type: object
      required:
      - kind
      - description
      title: ObservationCreate
    Profile:
      properties:
        skills:
          items:
            type: string
          type: array
          maxItems: 20
          title: Skills
          default: []
        interests:
          items:
            type: string
          type: array
          maxItems: 20
          title: Interests
          default: []
        locality:
          type: string
          maxLength: 160
          minLength: 2
          title: Locality
        availability:
          type: string
          maxLength: 300
          minLength: 2
          title: Availability
      additionalProperties: false
      type: object
      required:
      - locality
      - availability
      title: Profile
    Reading:
      properties:
        station:
          type: string
          maxLength: 160
          minLength: 3
          title: Station
        level_m:
          type: number
          maximum: 100.0
          minimum: 0.0
          title: Level M
        source:
          type: string
          maxLength: 300
          minLength: 5
          title: Source
      additionalProperties: false
      type: object
      required:
      - station
      - level_m
      - source
      title: Reading
    Refresh:
      properties:
        refresh_token:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Refresh Token
      additionalProperties: false
      type: object
      title: Refresh
    Register:
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 2
          title: Name
        email:
          anyOf:
          - type: string
            format: email
          - type: 'null'
          title: Email
        phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone
        password:
          type: string
          maxLength: 128
          minLength: 12
          title: Password
      additionalProperties: false
      type: object
      required:
      - name
      - password
      title: Register
    Resolve:
      properties:
        latitude:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Latitude
        longitude:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Longitude
        description:
          type: string
          maxLength: 5000
          minLength: 15
          title: Description
        image_id:
          type: string
          title: Image Id
      additionalProperties: false
      type: object
      required:
      - latitude
      - longitude
      - description
      - image_id
      title: Resolve
    ResponsibilityCreate:
      properties:
        category:
          type: string
          title: Category
        authority_id:
          type: string
          title: Authority Id
        boundary_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Boundary Id
        calendar_id:
          type: string
          title: Calendar Id
        priority:
          type: integer
          maximum: 1000.0
          minimum: 0.0
          title: Priority
          default: 0
        deadline_days:
          type: integer
          maximum: 90.0
          minimum: 1.0
          title: Deadline Days
          default: 3
        escalation_steps:
          items:
            $ref: '#/components/schemas/EscalationStep'
          type: array
          maxItems: 10
          title: Escalation Steps
          default: []
        active:
          type: boolean
          title: Active
          default: true
      additionalProperties: false
      type: object
      required:
      - category
      - authority_id
      - calendar_id
      title: ResponsibilityCreate
    RoleUpdate:
      properties:
        role:
          type: string
          enum:
          - CITIZEN
          - VOLUNTEER
          - AUTHORITY
          - ADMIN
          - SUPER_ADMIN
          - MODULE_DEVELOPER
          title: Role
        authority_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Authority Id
      additionalProperties: false
      type: object
      required:
      - role
      title: RoleUpdate
    SiteCreate:
      properties:
        latitude:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Latitude
        longitude:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Longitude
        name:
          type: string
          maxLength: 160
          minLength: 3
          title: Name
        capacity:
          type: integer
          maximum: 100000.0
          minimum: 0.0
          title: Capacity
          default: 0
        ownership_status:
          type: string
          enum:
          - UNVERIFIED
          - OFFICIALLY_VERIFIED
          title: Ownership Status
          default: UNVERIFIED
        verification_reference:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Verification Reference
      additionalProperties: false
      type: object
      required:
      - latitude
      - longitude
      - name
      title: SiteCreate
    StatusChange:
      properties:
        status:
          type: string
          enum:
          - ACKNOWLEDGED
          - IN_PROGRESS
          - REJECTED
          title: Status
        reason:
          type: string
          maxLength: 1000
          minLength: 5
          title: Reason
      additionalProperties: false
      type: object
      required:
      - status
      - reason
      title: StatusChange
    TreeCreate:
      properties:
        latitude:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Latitude
        longitude:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Longitude
        species:
          type: string
          maxLength: 160
          minLength: 2
          title: Species
        planting_date:
          type: string
          format: date
          title: Planting Date
        organization:
          type: string
          maxLength: 160
          title: Organization
          default: ''
        volunteer_group:
          type: string
          maxLength: 160
          title: Volunteer Group
          default: ''
        image_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Image Id
        site_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Site Id
        maintenance_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Maintenance Date
      additionalProperties: false
      type: object
      required:
      - latitude
      - longitude
      - species
      - planting_date
      title: TreeCreate
    TreeUpdate:
      properties:
        status:
          type: string
          enum:
          - PLANTED
          - HEALTHY
          - NEEDS_MAINTENANCE
          - DAMAGED
          - DEAD
          - REPLACED
          title: Status
        maintenance_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Maintenance Date
      additionalProperties: false
      type: object
      required:
      - status
      title: TreeUpdate
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    Verify:
      properties:
        resolved:
          type: boolean
          title: Resolved
        reason:
          type: string
          maxLength: 1000
          title: Reason
          default: ''
      additionalProperties: false
      type: object
      required:
      - resolved
      title: Verify
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
