name: nellai-demo
services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nellai}
      POSTGRES_USER: ${POSTGRES_USER:-nellai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env first}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redisdata:/data
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    command: [python, -m, alembic, upgrade, head]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/runtime/uploads
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    volumes:
      - uploads:/app/runtime/uploads
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    command: [python, -m, app.worker]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads:/app/runtime/uploads
  web:
    build:
      context: .
      dockerfile: docker/Web.Dockerfile
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      - backend
  ai:
    profiles: [ai]
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: [python, -m, uvicorn, ai.main:app, --host, 0.0.0.0, --port, '8001']
volumes:
  pgdata:
  redisdata:
  uploads:
